project:
  type: book
  output-dir: _site
  resources:
    - slides.html
    - slides_files

execute:
  freeze: auto

book:
  title: "An introduction to Pynapple"
  author:
    - name: Wolf De Wulf
      url: https://wulfdewolf.github.io
      email: wolf.de.wulf@ed.ac.uk
      orcid: 0000-0002-0219-3120
      corresponding: true
      affiliations:
        - id: UoE
          name: University of Edinburgh
          department: Institute for Neuroscience and Cardiovascular Research
          group: Nolan lab
          city: Edinburgh
          country: United Kingdom
        - id: Flatiron
          name: Flatiron Institute
          department: Center for Computational Neuroscience
          group: NeuroRSE
          city: New York
          country: United States
  sidebar:
    align: left
    style: floating
    collapse-level: 2
    pinned: false
    tools:
      - icon: link
        url: "https://pynapple.org"
        text: Pynapple website
  repo-url: "https://github.com/pynapple-org/pynapple"
  site-url: "https://pynapple.org"
  open-graph: true
  date: "02/06/2026"
  chapters:
    - index.qmd
    - part: History
      chapters:
        - 01-origins.qmd
        - 02-maintainers.qmd
    - part: Pynapple fundamentals
      chapters:
        - 03-time-series.qmd
    - part: Practise
      chapters:
        - project-ideas.qmd

format:
  html:
    theme:
      - flatly
